[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccc-nulls"
version = "0.1.0"
description = "Structure-preserving null models and FDR control for ligand-receptor cell-cell communication inference"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Kaushal" },
  { name = "Kshitij Bhardwaj" },
  { name = "Ankit" },
  { name = "Aritra" },
]
keywords = ["single-cell", "cell-cell communication", "ligand-receptor", "permutation test", "FDR", "LIANA"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
]

[project.optional-dependencies]
# liana 1.8 needs anndata < 0.12 (AnnData(dtype=...)); anndata 0.11 needs zarr < 3
liana = ["anndata>=0.10,<0.12", "zarr<3", "scanpy>=1.10,<1.12", "liana>=1.4", "pandas<3",
         "numpy<2.3", "scikit-learn>=1.3"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
pythonpath = ["."]
