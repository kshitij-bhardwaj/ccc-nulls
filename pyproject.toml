[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccc-nulls"
version = "0.1.0"
description = "Structure-preserving null models and FDR control for ligand-receptor cell-cell communication inference"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Kaushal" },
  { name = "Kshitij Bhardwaj" },
  { name = "Ankit" },
  { name = "Aritra" },
]
keywords = ["single-cell", "cell-cell communication", "ligand-receptor", "permutation test", "FDR", "LIANA"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
]

[project.optional-dependencies]
liana = ["anndata>=0.10", "scanpy>=1.10", "liana>=1.4"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
