name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[test]"
      - name: core library (no LIANA+)
        run: pytest -q tests --ignore=tests/test_liana_consensus.py

  liana:
    name: LIANA+ integration (pinned environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements/lock-liana-final.txt && pip install -e . --no-deps
      # tools/connectome: its adapter's tests are out of date with its adapter (tracked separately)
      - run: pytest -q --ignore=tools/connectome
